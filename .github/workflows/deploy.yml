# push するたびに，テスト → ビルド → Cloudflare へデプロイ
#   main ブランチ：本番（minimalist-online.<サブドメイン>.workers.dev）
#   test ブランチ：試験用（minimalist-online-test.<サブドメイン>.workers.dev．部屋のデータは本番と別）
# 手動実行（Run workflow）も main か test のときだけデプロイする（ほかのブランチを本番に出さないため）
name: deploy

on:
  push:
    branches: [main, test]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'deploy --name minimalist-online-test' }}
